<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Made Mail</title><link rel="stylesheet" href="/apps/web/style.css"></head><body><header><strong>Made Mail <span> / a little more together.</span></strong><small>LOCAL DEMO · SAMPLE MAIL ONLY</small></header><main><nav aria-label="Mailboxes"><h1>Your mail.<br>One place.</h1><button data-account="all">All inboxes</button><button data-account="personal">Personal · Inbox</button><button data-account="work">Work · Inbox</button><p class="note">Account connections are coming. This preview uses fictional messages.</p><button id="rules-toggle">Manage rules</button></nav><section id="mail"><div class="toolbar"><h2>All inboxes</h2><label>Search mail <input id="search" type="search" placeholder="Search sample mail"></label></div><div id="messages"></div></section><article id="reader" aria-live="polite"><p>Select a message to read.</p></article><section id="rules" hidden><h2>Rules, made clear.</h2><p>Preview actions against sample mail. No mail is changed or sent.</p><form id="rule-form"><label>Subject contains<input name="term" required placeholder="e.g. invoice"></label><label>Action<select name="action"><option value="move">Move to folder</option><option value="junk">Mark as Junk</option><option value="trash">Move to Deleted Items</option><option value="deletePermanently">Permanently delete</option><option value="autoReply">Send automatic response</option></select></label><label>Folder or response template<input name="value" placeholder="Required for move or response"></label><button type="submit">Preview rule</button></form><div id="preview" role="status"></div></section></main><script type="module" src="/apps/web/app.mjs"></script></body></html>
