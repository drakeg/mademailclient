[package]
name = "made-mail-native"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
made-mail-core = { path = "../../crates/mail-core" }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "=0.21.2", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "=0.6.2"

[lints]
workspace = true

[dependencies.keyring-core]
version = "=1.0.1"
[dependencies.serde]
version = "=1.0.229"
features = ["derive"]
[dependencies.serde_json]
version = "=1.0.154"
[dependencies.zeroize]
version = "=1.9.1"
[dependencies.uuid]
version = "=1.29.2"
features = ["v4"]

[target.'cfg(target_os = "macos")'.dependencies.apple-native-keyring-store]
version = "=1.0.2"
features = ["keychain"]
[target.'cfg(target_os = "windows")'.dependencies.windows-native-keyring-store]
version = "=1.1.0"
[target.'cfg(target_os = "linux")'.dependencies.dbus-secret-service-keyring-store]
version = "=1.0.1"
features = ["crypto-rust"]

[dependencies.native-tls]
version = "=0.2.18"
default-features = false
[dependencies.base64]
version = "=0.22.1"
