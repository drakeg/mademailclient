name: Publish tested desktop preview downloads
on:
  push:
    branches: [release/downloadable-alpha, 'release/milestone-*']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-desktop-preview
  cancel-in-progress: false
jobs:
  signed-mac:
    if: vars.MAC_RELEASE_ENABLED == 'true'
    environment: desktop-release
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            app: dist/mac-arm64/Made Mail.app
          - os: macos-15-intel
            arch: x64
            app: dist/mac/Made Mail.app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Require already-tested source before using signing credentials
        shell: bash
        run: |
          candidate_run=$(gh run list --workflow desktop.yml --commit "$GITHUB_SHA" --event push --status success --json databaseId --jq '.[0].databaseId')
          test -n "$candidate_run" && test "$candidate_run" != null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Configure public native OAuth client IDs
        run: node scripts/configure-oauth.mjs
        env:
          MADEMAIL_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          MADEMAIL_YAHOO_CLIENT_ID: ${{ vars.YAHOO_PUBLIC_CLIENT_ID }}
      - name: Sign and notarize Mac app and disk image
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          : "${CSC_LINK:?Missing Developer ID certificate}"
          : "${CSC_KEY_PASSWORD:?Missing certificate password}"
          : "${APPLE_API_KEY_BASE64:?Missing notarization key}"
          : "${APPLE_API_KEY_ID:?Missing key ID}"
          : "${APPLE_API_ISSUER:?Missing issuer ID}"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          node -e 'require("fs").writeFileSync(process.env.APPLE_API_KEY,Buffer.from(process.env.APPLE_API_KEY_BASE64,"base64"),{mode:0o600})'
          pnpm exec electron-builder --config scripts/electron-builder-mac-release.cjs --mac --${{ matrix.arch }} --publish never
          for dmg in dist/*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done
      - name: Verify trusted app and exercise packaged mail workflow
        shell: bash
        env:
          APP_BUNDLE: ${{ matrix.app }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          xcrun stapler validate "$APP_BUNDLE"
          spctl --assess --type execute --verbose=4 "$APP_BUNDLE"
          pnpm desktop:smoke "$APP_BUNDLE/Contents/MacOS/Made Mail"
          mount_dir=$(mktemp -d "$RUNNER_TEMP/mademail-dmg.XXXXXX")
          trap 'hdiutil detach "$mount_dir" || true; rmdir "$mount_dir" || true' EXIT
          hdiutil attach dist/*.dmg -readonly -nobrowse -mountpoint "$mount_dir"
          codesign --verify --deep --strict --verbose=2 "$mount_dir/Made Mail.app"
          xcrun stapler validate "$mount_dir/Made Mail.app"
          spctl --assess --type execute --verbose=4 "$mount_dir/Made Mail.app"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-mac-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
  publish:
    needs: signed-mac
    if: always() && (needs.signed-mac.result == 'success' || needs.signed-mac.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require a successful four-platform installer run for this exact commit
        shell: bash
        run: |
          candidate_run=$(gh run list --workflow desktop.yml --commit "$GITHUB_SHA" --event push --status success --json databaseId --jq '.[0].databaseId')
          test -n "$candidate_run" && test "$candidate_run" != null
          gh run download "$candidate_run" --name installer-win-x64 --dir release-assets
          gh run download "$candidate_run" --name installer-linux-x64 --dir release-assets
      - uses: actions/download-artifact@v4
        if: needs.signed-mac.result == 'success'
        with:
          pattern: signed-mac-*
          merge-multiple: true
          path: release-assets
      - name: Validate declared platforms and write checksums
        env:
          SIGNED_MAC_RESULT: ${{ needs.signed-mac.result }}
        shell: bash
        run: |
          export RELEASE_TAG="v$(node -p 'require("./package.json").version')"
          export RELEASE_PLATFORMS=windows-linux
          if [ "$SIGNED_MAC_RESULT" = success ]; then export RELEASE_PLATFORMS=all; fi
          node scripts/release-assets.mjs
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Tag tested source and publish explicitly requested experimental downloads
        shell: bash
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > existing-tag.json 2>/dev/null; then
            node -e 'const r=require("./existing-tag.json");if(r.object.sha!==process.env.GITHUB_SHA)throw Error("Existing tag points elsewhere; refusing to replace it")'
          else
            gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --prerelease --latest=false --title "Made Mail $RELEASE_TAG — mail workflow preview" --notes-file docs/releases/alpha-notes.md
